<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Monitor · 用量总览</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%234D6BFE'/%3E%3Cpath d='M4 12L8 4l4 8z' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#1A1A1C; --side:#1D1D20; --card:#252528; --card2:#2D2D31;
  --line:#2E2E32; --txt:#ECECEE; --sub:#9C9CA3; --dim:#6E6E76;
  --blue:#4D6BFE; --cyan:#5DC3F0; --purple:#8E7CFF; --green:#37B48F;
  --amber:#EF9F27; --red:#E24B4A;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:13px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;display:flex;min-height:100vh}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- 侧边栏 ---------- */
aside{width:208px;flex:none;background:var(--side);padding:20px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:8px;padding:4px 10px 20px;font-size:15px;font-weight:500}
.logo i{width:22px;height:22px;border-radius:6px;background:var(--blue);display:inline-flex;align-items:center;justify-content:center}
.logo i::after{content:"";width:8px;height:8px;border-radius:2px;background:#fff;display:block;clip-path:polygon(0 100%,50% 0,100% 100%)}
nav a{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:8px;color:var(--sub);cursor:pointer;margin-bottom:2px}
nav a svg{width:15px;height:15px;flex:none}
nav a:hover{background:var(--card);color:var(--txt)}
nav a.active{background:var(--card2);color:var(--txt)}
.side-foot{margin-top:auto;padding:10px;font-size:12px;color:var(--dim)}
.side-foot .t{margin-bottom:8px}
.side-foot button{width:100%;background:transparent;border:.5px solid var(--line);color:var(--sub);border-radius:8px;padding:7px 0;cursor:pointer;font-size:12px}
.side-foot button:hover{color:var(--txt);border-color:#3A3A41}
.side-foot button:disabled{opacity:.5;cursor:default}

/* ---------- 主区 ---------- */
main{flex:1;min-width:0;padding:20px 28px 48px}
.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.filters .lbl{color:var(--sub)}

/* 自定义下拉（对齐 DeepSeek：按钮 + 弹出菜单） */
.dd{position:relative}
.dd-btn{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:.5px solid var(--line);color:var(--sub);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}
.dd-btn:hover{border-color:#3A3A41}
.dd-btn b{color:var(--txt);font-weight:400;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-btn i{font-style:normal;font-size:9px;color:var(--dim);transition:transform .15s}
.dd.open .dd-btn i{transform:rotate(180deg)}
.dd.open .dd-btn{border-color:#3A3A41;background:var(--card2)}
.dd-menu{position:absolute;top:calc(100% + 6px);left:0;z-index:40;background:#26262B;border:.5px solid #3A3A41;border-radius:10px;padding:6px;min-width:148px;max-height:320px;overflow:auto;box-shadow:0 10px 28px rgba(0,0,0,.45)}
.dd-menu button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--sub);padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13px;text-align:left}
.dd-menu button:hover{background:#333338;color:var(--txt)}
.dd-menu button.on{color:var(--txt)}
.dd-menu button .ck{visibility:hidden;font-size:11px}
.dd-menu button.on .ck{visibility:visible}

.btn{background:var(--card);border:.5px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:13px}
.btn:hover{border-color:#3A3A41;background:var(--card2)}
.btn.primary{background:#ECECEE;border-color:#ECECEE;color:#17171A;font-weight:500}
.btn.primary:hover{background:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(77,107,254,.16);color:#A9B8FF;border:.5px solid rgba(77,107,254,.4);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
.chip[hidden]{display:none}
.chip b{font-weight:500}
.chip i{font-style:normal;opacity:.7;font-size:14px;line-height:1}
.spacer{flex:1}

.note{background:rgba(239,159,39,.08);border:.5px solid rgba(239,159,39,.25);color:#E8B96A;border-radius:8px;padding:8px 14px;margin-bottom:16px;font-size:12px}
.note.err{background:rgba(226,75,74,.08);border-color:rgba(226,75,74,.3);color:#F0A2A1}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border-radius:12px;padding:16px 18px}
.kpi .l{color:var(--sub);font-size:13px;margin-bottom:6px}
.kpi .v{font-size:24px;font-weight:500;letter-spacing:.2px;white-space:nowrap}
.kpi .s{color:var(--dim);font-size:12px;margin-top:4px}

/* 卡片与图表 */
.card{background:var(--card);border-radius:12px;padding:18px 20px;margin-bottom:18px}
.card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.card-head h3{font-size:14px;font-weight:500}
.card-head .val{color:var(--sub);font-size:13px}
.card-head .grow{flex:1}
.seg{display:flex;background:var(--card2);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;color:var(--sub);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px}
.seg button.on{background:#3A3A41;color:var(--txt)}
.chart-wrap{position:relative;width:100%;height:320px}
.chart-wrap.mini{height:190px}
.empty{color:var(--dim);text-align:center;padding:60px 0}

/* 模型分块（对齐 DeepSeek：模型名在卡片外，每模型两卡） */
.mb{margin-bottom:6px}
.mb > h4{font-size:14px;font-weight:500;margin:14px 2px 10px;cursor:pointer;display:flex;align-items:center;gap:8px}
.mb > h4:hover{color:#A9B8FF}
.mb > h4 .dot{width:9px;height:9px;border-radius:3px;flex:none}
.mb > h4 .focus-hint{font-size:11px;color:var(--dim);font-weight:400}
.mb-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.mini-card{background:var(--card);border-radius:12px;padding:16px 18px;margin-bottom:0}
.mini-card.focus{outline:.5px solid var(--blue)}
.mini-head{font-size:13px;color:var(--sub);margin-bottom:10px}
.mini-head b{color:var(--txt);font-weight:500;font-variant-numeric:tabular-nums}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.mb-grid{grid-template-columns:1fr}}
@media(max-width:860px){aside{display:none}}

/* 表格视图 */
table{width:100%;border-collapse:collapse}
th{color:var(--sub);font-weight:400;text-align:left;padding:10px 14px;border-bottom:.5px solid var(--line);font-size:12px;white-space:nowrap}
td{padding:11px 14px;border-bottom:.5px solid #26262B;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#26262B}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:#333338;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.muted{color:var(--dim);font-size:12px}
</style>
</head>
<body>
<h2 class="sr-only">本地 Agent Token 用量面板：按时间与数据源筛选，展示消耗金额、请求次数、Token 量与缓存命中率，并按模型分块展示明细。</h2>

<aside>
  <div class="logo"><i></i>Token Monitor</div>
  <nav id="nav">
    <a data-view="overview" class="active"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 13.5V8M6 13.5V3M10 13.5V6M14 13.5V9.5"/></svg>用量总览</a>
    <a data-view="agents"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2.5" width="12" height="4.5" rx="1.2"/><rect x="2" y="9" width="12" height="4.5" rx="1.2"/></svg>数据源</a>
    <a data-view="models"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11M2.5 8h11"/></svg>模型成本</a>
  </nav>
  <div class="side-foot">
    <div class="t">数据截至<br><span id="builtAt">—</span></div>
    <button id="reload">重新扫描数据源</button>
  </div>
</aside>

<main>
  <div class="filters">
    <div class="dd" id="ddRange">
      <button class="dd-btn"><span class="lbl">时间粒度</span><b id="ddRangeVal">近 30 天</b><i>▼</i></button>
      <div class="dd-menu" id="ddRangeMenu" hidden></div>
    </div>
    <div class="dd" id="ddAgent">
      <button class="dd-btn"><span class="lbl">数据源</span><b id="ddAgentVal">全部</b><i>▼</i></button>
      <div class="dd-menu" id="ddAgentMenu" hidden></div>
    </div>
    <span id="modelChip" class="chip" hidden></span>
    <div class="spacer"></div>
    <button class="btn primary" id="fExport">导出</button>
  </div>

  <div id="noteBox"></div>

  <!-- ── 视图 1：用量总览 ── -->
  <section id="view-overview">
    <div class="kpis">
      <div class="kpi"><div class="l">消耗金额</div><div class="v" id="kCost">—</div><div class="s" id="kCostSub"></div></div>
      <div class="kpi"><div class="l">API 请求次数</div><div class="v" id="kReq">—</div><div class="s" id="kReqSub"></div></div>
      <div class="kpi"><div class="l">Tokens</div><div class="v" id="kTok">—</div><div class="s" id="kTokSub"></div></div>
      <div class="kpi"><div class="l">缓存命中率</div><div class="v" id="kCache">—</div><div class="s" id="kCacheSub"></div></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h3 id="mainTitle">消耗金额（CNY）</h3>
        <span class="val" id="mainSum"></span>
        <div class="grow"></div>
        <div class="seg" id="segDim">
          <button data-d="agent" class="on">数据源</button>
          <button data-d="model">模型</button>
        </div>
        <div class="seg" id="segMetric">
          <button data-m="cost" class="on">金额</button>
          <button data-m="tokens">Tokens</button>
          <button data-m="requests">请求</button>
        </div>
        <div class="seg" id="segGrain">
          <button data-g="day" class="on">按日</button>
          <button data-g="month">按月</button>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="mainChart" role="img" aria-label="主图表：随时间变化的金额、Token 或请求量柱状图">加载中…</canvas></div>
    </div>

    <div id="modelBlocks"></div>
  </section>

  <!-- ── 视图 2：数据源 ── -->
  <section id="view-agents" hidden>
    <div class="card" style="padding:6px 4px">
      <table><thead><tr>
        <th>数据源</th><th class="num">Tokens</th><th class="num">请求次数</th>
        <th class="num">消耗金额</th><th style="width:26%">占比（Tokens）</th>
      </tr></thead><tbody id="tbAgent"></tbody></table>
    </div>
  </section>

  <!-- ── 视图 3：模型成本 ── -->
  <section id="view-models" hidden>
    <div class="card" style="padding:6px 4px">
      <table><thead><tr>
        <th>模型</th><th class="num">Tokens</th><th class="num">请求次数</th>
        <th class="num">消耗金额</th><th class="num">均价（¥/百万 tok）</th>
        <th style="width:22%">占比（金额）</th>
      </tr></thead><tbody id="tbModel"></tbody></table>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
"use strict";
let DATA = null, MAIN = null;
const MINIS = [];
const F = { rangeKey: "last30", agent: "all", metric: "cost", grain: "day", dim: "agent", model: null };
const PAL = ["#4D6BFE","#8E7CFF","#5DC3F0","#37B48F","#EF9F27","#E24B4A","#85B7EB","#F09595","#B4B2A9"];
const METRIC_NAME = { cost: "消耗金额（CNY）", tokens: "Tokens", requests: "API 请求次数" };
const DIM_NAME = { agent: "数据源", model: "模型" };
/* 时间粒度菜单（对齐 DeepSeek 选项） */
const RANGES = [
  ["today",     "今天"],
  ["yesterday", "昨天"],
  ["last7",     "近 7 天"],
  ["last30",    "近 30 天"],
  ["last90",    "近 90 天"],
  ["thismonth", "本月"],
  ["lastmonth", "上月"],
  ["all",       "全部"],
];
const RANGE_LABEL = Object.fromEntries(RANGES);
const $ = id => document.getElementById(id);

/* ---------- 格式化 ---------- */
const fmtInt = n => Math.round(n).toLocaleString("en-US");
const fmtTok = n => n >= 1e9 ? (n/1e9).toFixed(2)+" B" : n >= 1e6 ? (n/1e6).toFixed(1)+" M"
  : n >= 1e3 ? (n/1e3).toFixed(1)+" k" : String(Math.round(n));
const fmtCNY = n => "¥" + n.toLocaleString("en-US",{minimumFractionDigits:2, maximumFractionDigits:2});
const fmtUSD = n => "$" + n.toLocaleString("en-US",{minimumFractionDigits:2, maximumFractionDigits:2});
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- 工具 ---------- */
const ymd = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const md  = s => { const [,m,d] = s.split("-"); return String(+m)+"/"+String(+d); };   // 2026-09-16 → 9/16
const addDays = (s, n) => { const d = new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return ymd(d); };
/* 各时间粒度 → [start, end]；全部返回 null */
function rangeDates(){
  const max = DATA.range.max || ymd(new Date());
  const now = new Date(), today = ymd(now);
  switch (F.rangeKey){
    case "today":     return [today, today];
    case "yesterday": return [addDays(today,-1), addDays(today,-1)];
    case "last7":     return [addDays(max,-6), max];
    case "last30":    return [addDays(max,-29), max];
    case "last90":    return [addDays(max,-89), max];
    case "thismonth": return [ymd(new Date(now.getFullYear(), now.getMonth(), 1)), today];
    case "lastmonth": return [ymd(new Date(now.getFullYear(), now.getMonth()-1, 1)),
                              ymd(new Date(now.getFullYear(), now.getMonth(), 0))];
    default:          return null;
  }
}
/* 填充连续日期轴：无数据的日期补 0，与 DeepSeek 一致 */
function fillDays(pairs, start){
  if (!DATA.range.min || !DATA.range.max) return pairs;
  const map = new Map(pairs);
  const out = [];
  const s = start || DATA.range.min;
  const e = DATA.range.max;
  if (s > e) return pairs;
  for (let d = new Date(s+"T00:00:00"); d <= new Date(e+"T00:00:00"); d.setDate(d.getDate()+1))
    out.push([ymd(d), map.get(ymd(d)) || 0]);
  return out;
}
function rowsFor(keepUnknown){
  const range = rangeDates();
  return DATA.matrix.filter(r => {
    if (F.agent !== "all" && r.agent !== F.agent) return false;
    if (F.model && r.model !== F.model) return false;
    if (range){
      if (r.date === "unknown") return !!keepUnknown;
      if (r.date < range[0] || r.date > range[1]) return false;
    }
    return true;
  });
}
const cellVal = (r, m) => m === "cost" ? r.cost : m === "tokens" ? r.tokens : r.requests;

function groupSeries(rows, metric, grain){
  const map = new Map();
  for (const r of rows){
    if (r.date === "unknown") continue;
    const k = grain === "month" ? r.date.slice(0,7) : r.date;
    map.set(k, (map.get(k)||0) + cellVal(r, metric));
  }
  return [...map.entries()].sort((a,b)=>a[0]<b[0]?-1:1);
}

/* ---------- 图表公共样式 ---------- */
const TT = { backgroundColor:"#26262B", borderColor:"#3A3A41", borderWidth:1,
  titleColor:"#ECECEE", bodyColor:"#C9C9CF", padding:12, cornerRadius:10,
  displayColors:true, usePointStyle:true, boxWidth:8, boxHeight:8, boxPadding:4,
  bodySpacing:6, titleSpacing:6, titleMarginBottom:8 };
/* hover 竖直参考线（对齐 DeepSeek） */
const crosshair = { id: "crosshair",
  afterDatasetsDraw(c){
    const a = c.tooltip && c.tooltip._active;
    if (!a || !a.length) return;
    const x = a[0].element.x, ctx = c.ctx, top = c.chartArea.top, bot = c.chartArea.bottom;
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,.16)";
    ctx.lineWidth = 1; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bot); ctx.stroke();
    ctx.restore();
  } };
function baseOpts(fmt, legend){
  return { responsive:true, maintainAspectRatio:false,
    interaction:{ mode:"index", intersect:false },
    plugins:{ legend:{display:false},
      tooltip:{ ...TT, filter: i => i.parsed.y !== 0,
        callbacks:{ label:c => " " + fmt(c.parsed.y) } } },
    scales:{
      x:{ stacked:true, ticks:{ color:"#9C9CA3", font:{size:11}, maxRotation:0, autoSkip:true, maxTicksLimit:10 },
          grid:{ display:false }, border:{ color:"#2C2C32" } },
      y:{ stacked:true, beginAtZero:true, ticks:{ color:"#9C9CA3", font:{size:11}, maxTicksLimit:6, callback:fmt },
          grid:{ color:"rgba(255,255,255,.06)" }, border:{ display:false } } } };
}
const fmtTick = {
  cost: v => "¥" + (v>=1e4 ? (v/1e4).toFixed(1)+"k" : v.toFixed(0)),
  tokens: v => v>=1e9 ? (v/1e9).toFixed(1)+"B" : v>=1e6 ? (v/1e6).toFixed(0)+"M" : v>=1e3 ? (v/1e3).toFixed(0)+"k" : v,
  requests: v => v>=1e3 ? (v/1e3).toFixed(1)+"k" : v
};

/* ---------- 主流程 ---------- */
init();
function init(){
  fetch("/api/summary").then(r=>r.json()).then(d=>{ DATA=d; renderAll(); })
    .catch(e=>{ $("noteBox").innerHTML = `<div class="note err">数据加载失败：${esc(e.message)}</div>`; });
}

function renderAll(){
  renderAgentMenu();
  renderRangeMenu();
  renderFilterUI();
  renderKPI(); renderMain(); renderBlocks();
  renderAgentTable(); renderModelTable(); renderNote();
}

/* ---------- 下拉菜单 ---------- */
function renderRangeMenu(){
  const menu = $("ddRangeMenu");
  menu.innerHTML = RANGES.map(([k, label]) =>
    `<button data-k="${k}" class="${F.rangeKey===k ? "on" : ""}"><span>${label}</span><span class="ck">✓</span></button>`).join("");
  $("ddRangeVal").textContent = RANGE_LABEL[F.rangeKey];
}
function renderAgentMenu(){
  const menu = $("ddAgentMenu");
  menu.innerHTML = `<button data-k="all" class="${F.agent==="all" ? "on" : ""}"><span>全部</span><span class="ck">✓</span></button>` +
    DATA.agents.map(a =>
      `<button data-k="${esc(a.name)}" class="${F.agent===a.name ? "on" : ""}"><span>${esc(a.name)}</span><span class="ck">✓</span></button>`).join("");
  $("ddAgentVal").textContent = F.agent === "all" ? "全部" : F.agent;
}
function bindDropdown(ddId, menuId, onPick){
  const dd = $(ddId), menu = $(menuId);
  dd.querySelector(".dd-btn").onclick = e => {
    e.stopPropagation();
    const wasOpen = dd.classList.contains("open");
    closeAllDropdowns();
    if (!wasOpen){ dd.classList.add("open"); menu.hidden = false; }
  };
  menu.onclick = e => {
    const b = e.target.closest("button[data-k]"); if (!b) return;
    onPick(b.dataset.k);
    closeAllDropdowns();
  };
}
function closeAllDropdowns(){
  document.querySelectorAll(".dd.open").forEach(d => d.classList.remove("open"));
  document.querySelectorAll(".dd-menu").forEach(m => m.hidden = true);
}
document.addEventListener("click", closeAllDropdowns);

function renderFilterUI(){
  const chip = $("modelChip");
  if (F.model){
    chip.hidden = false;
    chip.innerHTML = `模型：<b>${esc(F.model)}</b><i>✕</i>`;
  } else chip.hidden = true;
}

function renderNote(){
  const k = DATA.kpi_all, box = $("noteBox");
  const range = rangeDates();
  let html = "";
  if (k.unpriced_tokens > 0)
    html += `<div class="note">其中 ${fmtTok(k.unpriced_tokens)} tokens（${(k.unpriced_tokens/k.tokens*100).toFixed(1)}%）模型价格未知，未计入金额 — 实际成本更高</div>`;
  if (range){
    const unk = DATA.matrix.filter(r=>r.date==="unknown" &&
      (F.agent==="all"||r.agent===F.agent) && (!F.model||r.model===F.model));
    const t = unk.reduce((s,r)=>s+r.tokens,0);
    if (t > 0) html += `<div class="note">时间筛选生效中：另有 ${fmtTok(t)} tokens 因日志缺失日期戳，仅在「全部」时计入</div>`;
  }
  if (DATA.scan_errors && DATA.scan_errors.length)
    html += `<div class="note err">部分数据源扫描失败：${esc(DATA.scan_errors.map(e=>e.agent).join("、"))}</div>`;
  box.innerHTML = html;
}

/* ---------- KPI ---------- */
function renderKPI(){
  const rows = rowsFor(true);                       // KPI 含日期未知行
  const tokens = rows.reduce((s,r)=>s+r.tokens,0);
  const req = rows.reduce((s,r)=>s+r.requests,0);
  const cost = rows.reduce((s,r)=>s+r.cost,0);
  const cr = rows.reduce((s,r)=>s+r.cr,0);
  const base = rows.reduce((s,r)=>s+r.inp+r.cw+r.cr,0);

  $("kCost").textContent = fmtCNY(cost * DATA.cny_rate);
  $("kCostSub").textContent = fmtUSD(cost) + " · 汇率 " + DATA.cny_rate;
  $("kReq").textContent = fmtInt(req);
  const range = rangeDates();
  const days = range ? Math.round((new Date(range[1]) - new Date(range[0]))/864e5) + 1
    : (DATA.range.max && DATA.range.min
      ? Math.round((new Date(DATA.range.max) - new Date(DATA.range.min))/864e5)+1 : 0);
  $("kReqSub").textContent = days ? "日均 " + fmtInt(req/days) : "全部时间";
  $("kTok").textContent = fmtInt(tokens);           // 对齐 DeepSeek：完整千分位
  $("kTokSub").textContent = fmtTok(tokens) + " tokens";
  $("kCache").textContent = (cr/Math.max(base,1)*100).toFixed(1) + "%";
  $("kCacheSub").textContent = fmtTok(cr) + " 缓存命中";
}

/* ---------- 主图 ---------- */
function renderMain(){
  const rows = rowsFor(false);
  const range = rangeDates();
  const fmt = fmtTick[F.metric];
  $("mainTitle").textContent = METRIC_NAME[F.metric] + (F.grain==="month" ? "（按月）" : "");

  /* 日期轴（与单序列版一致） */
  const raw = groupSeries(rows, F.metric, F.grain);
  const data = F.grain === "day" ? fillDays(raw, range && range[0]) : raw;
  const labels = data.map(d=>d[0]);
  const total = data.reduce((s,d)=>s+d[1],0);
  $("mainSum").textContent = F.metric==="cost" ? fmtCNY(total*DATA.cny_rate)
    : F.metric==="tokens" ? fmtTok(total)+" tok" : fmtInt(total)+" 次";

  /* 堆叠成员：TOP 6 + 其他 */
  const tot = new Map();
  for (const r of rows) tot.set(r[F.dim], (tot.get(r[F.dim])||0) + cellVal(r, F.metric));
  const topNames = [...tot.entries()].sort((a,b)=>b[1]-a[1]).slice(0,6).map(e=>e[0]);
  const others = rows.filter(r=>!topNames.includes(r[F.dim]));
  const members = topNames.map(name=>({ name, rows: rows.filter(r=>r[F.dim]===name) }));
  if (others.length) members.push({ name: "其他", rows: others });
  const series = members.map(m=>{
    const mm = new Map(groupSeries(m.rows, F.metric, F.grain));
    return { name: m.name, data: labels.map(l=>mm.get(l)||0) };
  });

  const opts = baseOpts(fmt, F.metric==="cost"?"¥":"");
  if (F.grain === "day") opts.scales.x.ticks.callback = (v, i) => md(labels[i] || v);
  opts.plugins.tooltip.callbacks.title = items => {
    if (!items || !items.length) return "";
    const k = items[0].label;
    const tot2 = items.reduce((s,i)=>s+(i.parsed.y||0),0);
    const totTxt = F.metric==="cost" ? fmtCNY(tot2*DATA.cny_rate)
      : F.metric==="tokens" ? fmtTok(tot2)+" tok" : fmtInt(tot2)+" 次";
    return k + "    " + totTxt;
  };
  opts.plugins.tooltip.callbacks.label = c => {
    const v = c.parsed.y;
    const txt = F.metric==="cost" ? fmtCNY(v*DATA.cny_rate)
      : F.metric==="tokens" ? fmtTok(v)+" tok" : fmtInt(v)+" 次";
    return " " + c.dataset.label + "   " + txt;
  };

  if (MAIN) MAIN.destroy();
  MAIN = new Chart($("mainChart"), {
    type: "bar",
    data: { labels, datasets: series.map((s,i)=>({
      label: s.name, data: s.data, backgroundColor: PAL[i % PAL.length],
      stack: "s", maxBarThickness: 26, barPercentage: .72, categoryPercentage: .72,
      borderRadius: i === series.length-1 ? { topLeft:3, topRight:3 } : 0,
      borderSkipped: false })) },
    options: opts,
    plugins: [crosshair]
  });
}

/* ---------- 模型分块 ---------- */
function renderBlocks(){
  const rows = rowsFor(false);
  const range = rangeDates();
  const byModel = new Map();
  for (const r of rows){
    const o = byModel.get(r.model) || {tokens:0, cost:0, requests:0};
    o.tokens += r.tokens; o.cost += r.cost; o.requests += r.requests;
    byModel.set(r.model, o);
  }
  const top = [...byModel.entries()].sort((a,b)=>b[1].tokens-a[1].tokens).slice(0,6);
  const wrap = $("modelBlocks");
  if (!top.length){ wrap.innerHTML = ""; return; }

  MINIS.forEach(c=>c.destroy()); MINIS.length = 0;
  wrap.innerHTML = `<div style="display:flex;align-items:baseline;gap:10px;margin:6px 2px 0">
      <h3 style="font-size:14px;font-weight:500">按模型分解</h3>
      <span class="muted">点击模型名聚焦 / 取消聚焦</span></div>
    <div id="blk"></div>`;
  const blk = $("blk");

  top.forEach(([model, o], i)=>{
    const color = PAL[i % PAL.length];
    const sec = document.createElement("div");
    sec.className = "mb";
    sec.innerHTML = `
      <h4 title="点击聚焦该模型"><span class="dot" style="background:${color}"></span>${esc(model)}
        <span class="focus-hint">${F.model===model ? "✓ 已聚焦" : ""}</span></h4>
      <div class="mb-grid">
        <div class="mini-card${F.model===model ? " focus" : ""}">
          <div class="mini-head">API 请求次数 <b>${fmtInt(o.requests)}</b></div>
          <div class="chart-wrap mini"><canvas id="mr${i}" role="img" aria-label="${esc(model)} 每日请求次数图"></canvas></div>
        </div>
        <div class="mini-card${F.model===model ? " focus" : ""}">
          <div class="mini-head">Tokens <b>${fmtInt(o.tokens)}</b> · ${fmtCNY(o.cost*DATA.cny_rate)}</div>
          <div class="chart-wrap mini"><canvas id="mt${i}" role="img" aria-label="${esc(model)} 每日 Token 柱状图"></canvas></div>
        </div>
      </div>`;
    sec.querySelector("h4").onclick = () => { F.model = F.model===model ? null : model; renderAll(); };
    blk.appendChild(sec);

    /* 迷你图公共配置：还原 DeepSeek 的网格线与轴刻度 */
    const mrows = rows.filter(r=>r.model===model);
    const start = range && range[0];
    const sReq = fillDays(groupSeries(mrows, "requests", "day"), start);
    const sTok = fillDays(groupSeries(mrows, "tokens", "day"), start);
    const axis = {
      x: { ticks: { color:"#9C9CA3", font:{size:11}, maxTicksLimit:4, maxRotation:0,
                    autoSkip:true, callback:(v, idx) => md(sReq[idx][0] || "") },
           grid: { color:"rgba(255,255,255,.05)" }, border: { color:"#2C2C32" } },
      y: { beginAtZero:true, ticks: { color:"#9C9CA3", font:{size:11}, maxTicksLimit:3,
                    callback: v => fmtTick.tokens(v) },
           grid: { color:"rgba(255,255,255,.06)" }, border: { display:false } }
    };
    const ttBase = (fmtFn) => ({ ...TT, callbacks: {
      title: items => items && items.length ? items[0].label : "",
      label: c => " " + fmtFn(c.parsed.y) } });

    /* 请求 → 平滑面积线（对齐 DeepSeek） */
    MINIS.push(new Chart($("mr"+i), { type: "line",
      data: { labels: sReq.map(d=>d[0]),
        datasets: [{ data: sReq.map(d=>d[1]), borderColor: color,
          backgroundColor: color + "40", fill: true, tension: 0.4,
          borderWidth: 1.5, pointRadius: 0, pointHoverRadius: 3 }] },
      options: { responsive:true, maintainAspectRatio:false,
        plugins: { legend:{display:false}, tooltip: ttBase(v => fmtInt(v) + " 次") },
        scales: axis } }));

    /* Tokens → 浅蓝细柱（对齐 DeepSeek） */
    MINIS.push(new Chart($("mt"+i), { type: "bar",
      data: { labels: sTok.map(d=>d[0]),
        datasets: [{ data: sTok.map(d=>d[1]), backgroundColor: "#8FCDF0",
          borderRadius: 2, maxBarThickness: 6 }] },
      options: { responsive:true, maintainAspectRatio:false,
        plugins: { legend:{display:false}, tooltip: ttBase(v => fmtTok(v) + " tok") },
        scales: axis } }));
  });
}

/* ---------- 表格视图 ---------- */
function barCell(v, max, color){
  return `<td><div class="bar"><i style="width:${max?Math.max(v/max*100,1):0}%;background:${color}"></i></div></td>`;
}
function renderAgentTable(){
  const rows = rowsFor(true);
  const agg = new Map();
  for (const r of rows){
    const o = agg.get(r.agent) || {tokens:0, cost:0, requests:0};
    o.tokens += r.tokens; o.cost += r.cost; o.requests += r.requests;
    agg.set(r.agent, o);
  }
  const list = [...agg.entries()].sort((a,b)=>b[1].tokens-a[1].tokens);
  const max = list.length ? list[0][1].tokens : 0;
  $("tbAgent").innerHTML = list.map(([name,o],i)=>`
    <tr><td><span class="dot" style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${PAL[i%PAL.length]};margin-right:8px"></span>${esc(name)}</td>
    <td class="num">${fmtInt(o.tokens)}</td><td class="num">${fmtInt(o.requests)}</td>
    <td class="num">${fmtCNY(o.cost*DATA.cny_rate)}</td>${barCell(o.tokens,max,PAL[i%PAL.length])}</tr>`).join("")
    || `<tr><td colspan="5" class="empty">当前筛选下无数据</td></tr>`;
}
function renderModelTable(){
  const rows = rowsFor(true);
  const agg = new Map();
  for (const r of rows){
    const o = agg.get(r.model) || {tokens:0, cost:0, requests:0};
    o.tokens += r.tokens; o.cost += r.cost; o.requests += r.requests;
    agg.set(r.model, o);
  }
  const list = [...agg.entries()].sort((a,b)=>b[1].cost-a[1].cost);
  const max = list.length ? Math.max(list[0][1].cost, 1e-9) : 1;
  $("tbModel").innerHTML = list.map(([name,o],i)=>{
    const avg = o.tokens ? o.cost*DATA.cny_rate/o.tokens*1e6 : 0;
    return `<tr><td class="mono">${esc(name)}</td>
    <td class="num">${fmtInt(o.tokens)}</td><td class="num">${fmtInt(o.requests)}</td>
    <td class="num">${fmtCNY(o.cost*DATA.cny_rate)}</td>
    <td class="num">${avg ? "¥"+avg.toFixed(2) : '<span class="muted">价格未知</span>'}</td>
    ${barCell(o.cost,max,i<3?"#4D6BFE":"#3A3A41")}</tr>`;
  }).join("") || `<tr><td colspan="6" class="empty">当前筛选下无数据</td></tr>`;
}

/* ---------- 事件 ---------- */
$("nav").addEventListener("click", e=>{
  const a = e.target.closest("a[data-view]"); if (!a) return;
  document.querySelectorAll("#nav a").forEach(x=>x.classList.toggle("active", x===a));
  ["overview","agents","models"].forEach(v=>$("view-"+v).hidden = v!==a.dataset.view);
});
bindDropdown("ddRange", "ddRangeMenu", k => { F.rangeKey = k; renderAll(); });
bindDropdown("ddAgent", "ddAgentMenu", k => { F.agent = k; renderAll(); });
$("segDim").onclick = e => { const b=e.target.closest("button"); if(!b) return;
  F.dim=b.dataset.d;
  document.querySelectorAll("#segDim button").forEach(x=>x.classList.toggle("on",x===b));
  renderMain(); };
$("segMetric").onclick = e => { const b=e.target.closest("button"); if(!b) return;
  F.metric=b.dataset.m;
  document.querySelectorAll("#segMetric button").forEach(x=>x.classList.toggle("on",x===b));
  renderMain(); };
$("segGrain").onclick = e => { const b=e.target.closest("button"); if(!b) return;
  F.grain=b.dataset.g;
  document.querySelectorAll("#segGrain button").forEach(x=>x.classList.toggle("on",x===b));
  renderMain(); };
$("modelChip").onclick = () => { F.model=null; renderAll(); };
$("fExport").onclick = () => {
  const rows = rowsFor(true);
  const head = "date,agent,model,tokens,input,output,cache_read,cache_write,requests,cost_usd,cost_cny";
  const lines = rows.map(r=>[r.date,r.agent,r.model,r.tokens,r.inp,r.out,r.cr,r.cw,
    r.requests,(r.cost).toFixed(6),(r.cost*DATA.cny_rate).toFixed(4)].join(","));
  const blob = new Blob(["\uFEFF"+head+"\n"+lines.join("\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `token-usage-${F.agent==="all"?"all":F.agent}-${F.rangeKey}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
};
$("reload").onclick = async function(){
  this.disabled = true; this.textContent = "扫描中…";
  try { await fetch("/api/reload"); DATA = await (await fetch("/api/summary")).json(); renderAll(); }
  finally { this.disabled = false; this.textContent = "重新扫描数据源"; }
};
</script>
