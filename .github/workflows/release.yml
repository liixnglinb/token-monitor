name: release

# 推送 v* 标签 → 自动构建 Windows 安装包 + 便携包 → 发布到 GitHub Releases
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 写入版本号
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Set-Content -Path version.txt -Value $tag -Encoding utf8
          echo "VERSION=$tag" >> $env:GITHUB_ENV

      - name: PyInstaller 打包
        run: >
          pyinstaller --noconfirm --onefile --name TokenMonitor
          --windowed --icon "icon.ico"
          --add-data "webapp/static;webapp/static"
          --add-data "version.txt;."
          --hidden-import uvicorn --hidden-import uvicorn.loops
          --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols
          --hidden-import uvicorn.protocols.http --hidden-import uvicorn.protocols.http.auto
          --hidden-import uvicorn.lifespan --hidden-import uvicorn.lifespan.on
          --hidden-import webview --hidden-import webview.platforms.winforms
          --hidden-import webview.platforms.edgechromium
          --hidden-import clr_loader --hidden-import pythonnet --hidden-import clr
          main.py

      - name: 打安装包（Inno Setup）
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /DAppVersion="${{ github.ref_name }}" installer.iss

      - name: 打便携包
        shell: pwsh
        run: |
          Copy-Item dist\TokenMonitor.exe TokenMonitor.exe
          Compress-Archive -Path TokenMonitor.exe -DestinationPath dist\TokenMonitor-portable-${{ github.ref_name }}.zip
          Remove-Item TokenMonitor.exe

      - name: 校验产物
        shell: pwsh
        run: |
          Get-ChildItem dist | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length/1MB) }
          if (-not (Test-Path "dist\TokenMonitor.exe")) { throw "exe 缺失" }
          if (-not (Test-Path "dist\TokenMonitor-setup-${{ github.ref_name }}.exe")) { throw "安装包缺失" }

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TokenMonitor.exe
            dist/TokenMonitor-setup-*.exe
            dist/TokenMonitor-portable-*.zip
          generate_release_notes: true
