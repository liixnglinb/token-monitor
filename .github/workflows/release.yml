name: release

# 推送 v* 标签 → 自动构建 Windows 安装包 + 单文件 exe → 发布到 GitHub Releases
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # 标签名不进命令行：所有步骤统一读 $env:APP_VERSION。
      # 直接 ${{ github.ref_name }} 拼进 pwsh 语句里，等于把外部输入当代码执行。
      APP_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # 发版门禁：绿了才允许继续打包上传。以前 CI 只装依赖直接打包，
      # 单测和前端语法都只在本地跑过，等于"标签一推就发版"没有拦网。
      - name: 验收门禁（单元测试 + 前端语法）
        shell: bash
        run: |
          pip install -r requirements-dev.txt
          python -m pytest tests -q
          # 逐文件 + 按 index.html 的真实加载顺序拼起来再查一遍：
          # 九个脚本共用一个全局作用域，跨文件重名的 let/const 会让整块脚本
          # 静默中止（症状是"某个函数怎么就 undefined 了"），单文件查不出来。
          for f in webapp/static/js/*.js; do node --check "$f"; done
          ORDER=$(grep -o 'js/[a-z_]*\.js' webapp/static/index.html | sed 's#^#webapp/static/#')
          cat $ORDER > "$RUNNER_TEMP/tm-all.js"
          node --check "$RUNNER_TEMP/tm-all.js"
          echo "门禁通过：单测 + $(echo "$ORDER" | wc -w) 个前端脚本（拼接 $(wc -l < "$RUNNER_TEMP/tm-all.js") 行）"

      - name: 依赖漏洞扫描
        shell: bash
        run: |
          pip install pip-audit
          # requirements.txt 里不能写非 ASCII 注释：pip-audit 用本地编码读文件
          pip-audit -r requirements.txt --strict

      - name: 写入版本号
        shell: pwsh
        run: |
          $tag = $env:APP_VERSION
          # 明确写"无 BOM"的 UTF-8：PowerShell 5.1 的 Set-Content -Encoding utf8 会写 BOM，
          # 而 BOM 会让 updater._parse 抛错，导致"已是最新还提示更新"
          [System.IO.File]::WriteAllText("$PWD/version.txt", $tag, (New-Object System.Text.UTF8Encoding($false)))
          echo "VERSION=$tag" >> $env:GITHUB_ENV

      - name: PyInstaller 打包
        run: >
          pyinstaller --noconfirm --onefile --name TokenMonitor
          --windowed --icon "icon.ico"
          --add-data "webapp/static;webapp/static"
          --add-data "version.txt;."
          --add-data "icon.ico;."
          --hidden-import uvicorn --hidden-import uvicorn.loops
          --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols
          --hidden-import uvicorn.protocols.http --hidden-import uvicorn.protocols.http.h11_impl
          --hidden-import uvicorn.lifespan --hidden-import uvicorn.lifespan.on
          --hidden-import webview --hidden-import webview.platforms.winforms
          --hidden-import webview.platforms.edgechromium
          --hidden-import clr_loader --hidden-import pythonnet --hidden-import clr
          --hidden-import pystray --hidden-import pystray._win32 --collect-all pystray
          --collect-all PIL
          --hidden-import _cffi_backend --collect-all cffi --collect-all clr_loader --collect-all pythonnet
          main.py

      - name: 打安装包（Inno Setup）
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /DAppVersion="$env:APP_VERSION" installer.iss

      - name: 校验产物
        shell: pwsh
        run: |
          Get-ChildItem dist | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length/1MB) }
          if (-not (Test-Path "dist\TokenMonitor.exe")) { throw "exe 缺失" }
          if (-not (Test-Path "dist\TokenMonitor-setup-$env:APP_VERSION.exe")) { throw "安装包缺失" }

      # 为每个发布产物生成对应的 .sha256 校验文件，供客户端自更新时校验下载
      # 完整性，防止镜像返回截断/被篡改的包导致替换后变砖。
      - name: 生成 SHA256 校验文件
        shell: pwsh
        run: |
          Get-ChildItem dist | ForEach-Object {
            # Get-FileHash 默认输出大写，这里转小写；格式：小写hash + 两个空格 + 文件名（ASCII 编码）
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "dist\$($_.Name).sha256" -Encoding ascii
          }
          Get-ChildItem dist\*.sha256 | ForEach-Object { Get-Content $_.FullName }

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TokenMonitor.exe
            dist/TokenMonitor-setup-*.exe
            dist/*.sha256
          generate_release_notes: true
