<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="background" x1="38" y1="18" x2="218" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18202A"/>
      <stop offset=".52" stop-color="#0C1117"/>
      <stop offset="1" stop-color="#05070A"/>
    </linearGradient>
    <linearGradient id="value" x1="76" y1="176" x2="120" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8FB2FF"/>
      <stop offset="1" stop-color="#D6E4FF"/>
    </linearGradient>
    <linearGradient id="spark" x1="98" y1="33" x2="134" y2="69" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB27A"/>
      <stop offset="1" stop-color="#FF8A4C"/>
    </linearGradient>
  </defs>

  <!-- 底板：近黑圆角方（与软件界面同色系） -->
  <rect x="4" y="4" width="248" height="248" rx="58" fill="url(#background)"/>
  <rect x="4.75" y="4.75" width="246.5" height="246.5" rx="57.25" fill="none"
        stroke="#ffffff" stroke-opacity=".07" stroke-width="1.5"/>

  <!-- 量表：底弧（270°）+ 值弧 + 橙色值点 -->
  <path d="M74 178 A70 70 0 1 1 182 178" fill="none" stroke="#26303E"
        stroke-width="26" stroke-linecap="round"/>
  <path d="M74 178 A70 70 0 0 1 116 51" fill="none" stroke="url(#value)"
        stroke-width="26" stroke-linecap="round"/>
  <circle cx="116" cy="51" r="21" fill="url(#spark)" stroke="#0B0E12" stroke-width="7"/>
</svg>
